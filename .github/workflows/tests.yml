name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: python -m pip install ".[dev]"
      - name: Run offline tests
        run: python -m pytest -m "not integration" -v

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Import the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/ibgedata-wheel"
          "$RUNNER_TEMP/ibgedata-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ibgedata-wheel/bin/python" -c "from importlib.metadata import version; import ibgedata; assert version('ibgedata') == ibgedata.__version__; assert all(hasattr(ibgedata, name) for name in ibgedata.__all__)"
