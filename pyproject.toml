[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibgedata"
version = "0.1.0"
description = "Typed, offline-testable client for official IBGE SIDRA APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Teodoro", email = "rodrigoteodoro.90@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.urls]
Homepage = "https://github.com/rteoo/ibgedata"
Repository = "https://github.com/rteoo/ibgedata"
Issues = "https://github.com/rteoo/ibgedata/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibgedata = ["py.typed"]

[tool.pytest.ini_options]
markers = [
  "integration: requires network access to an official IBGE endpoint",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
